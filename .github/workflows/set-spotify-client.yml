name: Set Spotify Client ID
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-spotify-client.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set client id and clean workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="clientId: localStorage.getItem('kimchi_spotify_client_id') || '',"
          new="clientId: localStorage.getItem('kimchi_spotify_client_id') || '00ff2fef90884181977ab901d0d6becc',"
          if old not in s:
              raise SystemExit('Spotify client placeholder not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect Spotify client ID"
          git push
