name: Deploy current K-Music
on:
  push:
    branches: [main]
    paths:
      - 'deployv3/TRIGGER'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current site and clean repo
        shell: bash
        run: |
          set -euo pipefail
          cat deployv3/part00.txt deployv3/part01.txt deployv3/part02.txt deployv3/part03.txt deployv3/part04.txt deployv3/part05.txt deployv3/part06.txt deployv3/part07.txt deployv3/part08.txt deployv3/part09.txt deployv3/part10.txt deployv3/part11.txt deployv3/part12.txt > /tmp/site.b64
          base64 -d /tmp/site.b64 | gzip -dc > /tmp/index.html
          test "$(wc -c < /tmp/index.html)" -eq 411209
          echo "b1c0d2a9e1c393dd78fab99059928083f31d42f80517cf65666d597af104c092  /tmp/index.html" | sha256sum -c -
          mv /tmp/index.html index.html
          rm -rf loader.js pack tmp deployv3
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish current K-Music app"
          git push
